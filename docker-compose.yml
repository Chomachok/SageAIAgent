version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: sage-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sage
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: backend/src/Sage.Api/Dockerfile
    container_name: sage-api
    ports:
      - "5000:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:80
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=sage;Username=postgres;Password=postgres
      - LLM__Provider=${LLM__Provider}
      - LLM__ModelId=${LLM__ModelId}
      - LLM__Endpoint=${LLM__Endpoint}
      - LLM__ApiKey=${GROQ_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - ./test-files:/app/test-files 

volumes:
  postgres_data: