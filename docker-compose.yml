version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: sage-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sage
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: backend/src/Sage.Api/Dockerfile
    container_name: sage-api
    ports:
      - "5000:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:80
      # Переопределяем строку подключения через переменную окружения
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=sage;Username=postgres;Password=postgres
      # Токен LLM передаём через переменную (читается из .env или окружения)
      - LLM__ApiKey=${GITHUB_TOKEN}
      # Можно переопределить и другие настройки, если нужно
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data: